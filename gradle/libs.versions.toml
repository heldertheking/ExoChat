[versions]
java = "25"
spring-boot = "4.0.5"
spring-grpc = "1.0.3"
grpc = "1.77.1"
protobuf = "4.33.4"
protoc-plugin = "0.10.1"
protovalidate = "1.3.0"
google-common-protos = "2.79.0"
api-common = "2.74.0"
guava = "33.7.2-jre"
jspecify = "1.0.1"
junit-bom = "6.1.3"
assertj = "3.27.7"
errorprone-plugin = "5.2.0"
errorprone-core = "2.53.0"
nullaway = "0.14.4"
jooq = "3.21.10"
antlr = "4.13.2"
slf4j = "2.0.20"
mockito = "5.24.0"
h2 = "2.5.252"
liquibase = "5.0.4"
mariadb = "4.0.0"
picocli = "4.7.7"
jacoco = "0.8.14"

[libraries]
grpc-netty = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
spring-grpc-server-starter = { module = "org.springframework.grpc:spring-grpc-server-spring-boot-starter", version.ref = "spring-grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
jakarta-annotation = { module = "jakarta.annotation:jakarta.annotation-api", version = "3.0.0" }
protovalidate = { module = "build.buf:protovalidate", version.ref = "protovalidate" }
google-common-protos = { module = "com.google.api.grpc:proto-google-common-protos", version.ref = "google-common-protos" }
api-common = { module = "com.google.api:api-common", version.ref = "api-common" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone-core" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
antlr-tool = { module = "org.antlr:antlr4", version.ref = "antlr" }
antlr-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[bundles]
grpc = [
    "grpc-netty",
    "grpc-protobuf",
    "grpc-stub",
    "protobuf-java",
    "jakarta-annotation",
    "protovalidate",
    "google-common-protos"
]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
protobuf = { id = "com.google.protobuf", version.ref = "protoc-plugin" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
liquibase = { id = "org.liquibase.gradle", version = "3.1.1" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }