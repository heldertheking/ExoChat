databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: exochat
      comment: >
        Baseline of the identity schema. While nothing is deployed this changelog is edited in place and the local
        databases are wiped (docker compose down -v); once a database exists that must be kept, add new changesets
        instead. All primary keys are UUIDv7 generated by the application (ADR-011).
        user is the root login identity (proto User): contact data and credentials.
        account is the public persona of a user (proto Account), name users/{user}/accounts/{account}; the username is
        a globally unique handle and the presence status is not stored, it is live data. standing is the platform
        status of the account (MEMBER, RESTRICTED, SUSPENDED) that selects its base rule set, set by the platform only.
        account_rule holds the rules the platform set on an account on top of its standing (ALLOW or DENY, no row
        means inherited); rule is the name of the Rule enum of the application, unknown names are ignored.
        relationship is a social link from an owning account to a target account (proto Relationship). A friendship is
        two rows (one per account), a block a single row on the blocking side; type holds the RelationshipType
        without UNSPECIFIED.
        session is one login of a user on one device (proto Session, ADR-012), name users/{user}/sessions/{session}.
        It holds the refresh token family: only SHA-256 hashes are stored, the current one and the one it replaced
        (presenting the replaced one again means theft and the session row is deleted). Revoking a session deletes the
        row. expire_time slides with use, absolute_expire_time caps the session. If the active account is deleted
        account_id becomes NULL and the next refresh falls back to the first account of the user.
      changes:
        - sql:
            sql: >
              CREATE TABLE `user` (
                `id` UUID NOT NULL,
                `email` VARCHAR(320) NOT NULL,
                `phone_number` VARCHAR(32) NULL,
                `password_hash` VARCHAR(255) NOT NULL,
                `create_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                `update_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                PRIMARY KEY (`id`),
                CONSTRAINT `uq_user_email` UNIQUE (`email`),
                CONSTRAINT `uq_user_phone_number` UNIQUE (`phone_number`)
              )
        - sql:
            sql: >
              CREATE TABLE `account` (
                `id` UUID NOT NULL,
                `user_id` UUID NOT NULL,
                `username` VARCHAR(32) NOT NULL,
                `display_name` VARCHAR(64) NOT NULL,
                `avatar_url` VARCHAR(2048) NULL,
                `standing` VARCHAR(16) NOT NULL DEFAULT 'MEMBER',
                `create_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                `update_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                PRIMARY KEY (`id`),
                CONSTRAINT `uq_account_username` UNIQUE (`username`),
                CONSTRAINT `ck_account_standing` CHECK (`standing` IN ('MEMBER', 'RESTRICTED', 'SUSPENDED')),
                CONSTRAINT `fk_account_user` FOREIGN KEY (`user_id`) REFERENCES `user` (`id`) ON DELETE CASCADE,
                KEY `ix_account_user` (`user_id`, `id`)
              )
        - sql:
            sql: >
              CREATE TABLE `account_rule` (
                `account_id` UUID NOT NULL,
                `rule` VARCHAR(64) NOT NULL,
                `state` VARCHAR(8) NOT NULL,
                PRIMARY KEY (`account_id`, `rule`),
                CONSTRAINT `ck_account_rule_state` CHECK (`state` IN ('ALLOW', 'DENY')),
                CONSTRAINT `fk_account_rule_account` FOREIGN KEY (`account_id`) REFERENCES `account` (`id`) ON DELETE CASCADE
              )
        - sql:
            sql: >
              CREATE TABLE `relationship` (
                `id` UUID NOT NULL,
                `owner_account_id` UUID NOT NULL,
                `target_account_id` UUID NOT NULL,
                `type` VARCHAR(20) NOT NULL,
                `create_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                `update_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                PRIMARY KEY (`id`),
                CONSTRAINT `uq_relationship_owner_target` UNIQUE (`owner_account_id`, `target_account_id`),
                CONSTRAINT `ck_relationship_type` CHECK (`type` IN ('FRIEND', 'PENDING_INCOMING', 'PENDING_OUTGOING', 'BLOCKED')),
                CONSTRAINT `ck_relationship_not_self` CHECK (`owner_account_id` <> `target_account_id`),
                CONSTRAINT `fk_relationship_owner` FOREIGN KEY (`owner_account_id`) REFERENCES `account` (`id`) ON DELETE CASCADE,
                CONSTRAINT `fk_relationship_target` FOREIGN KEY (`target_account_id`) REFERENCES `account` (`id`) ON DELETE CASCADE,
                KEY `ix_relationship_target` (`target_account_id`)
              )
        - sql:
            sql: >
              CREATE TABLE `session` (
                `id` UUID NOT NULL,
                `user_id` UUID NOT NULL,
                `account_id` UUID NULL,
                `device_label` VARCHAR(100) NULL,
                `refresh_token_hash` BINARY(32) NOT NULL,
                `previous_refresh_token_hash` BINARY(32) NULL,
                `create_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                `last_used_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                `expire_time` DATETIME(6) NOT NULL,
                `absolute_expire_time` DATETIME(6) NOT NULL,
                PRIMARY KEY (`id`),
                CONSTRAINT `uq_session_refresh_token_hash` UNIQUE (`refresh_token_hash`),
                CONSTRAINT `fk_session_user` FOREIGN KEY (`user_id`) REFERENCES `user` (`id`) ON DELETE CASCADE,
                CONSTRAINT `fk_session_account` FOREIGN KEY (`account_id`) REFERENCES `account` (`id`) ON DELETE SET NULL,
                KEY `ix_session_user` (`user_id`, `id`),
                KEY `ix_session_previous_refresh_token_hash` (`previous_refresh_token_hash`),
                KEY `ix_session_expire_time` (`expire_time`)
              )
      rollback:
        - sql:
            sql: DROP TABLE `session`
        - sql:
            sql: DROP TABLE `relationship`
        - sql:
            sql: DROP TABLE `account_rule`
        - sql:
            sql: DROP TABLE `account`
        - sql:
            sql: DROP TABLE `user`
