databaseChangeLog:
  - changeSet:
      id: 004-create-account
      author: exochat
      comment: >
        account is the public persona of a user (proto Account), name users/{user}/accounts/{account}. The username
        is a globally unique handle. The presence status of the proto is not stored, it is live data.
      changes:
        - sql:
            sql: >
              CREATE TABLE `account` (
                `id` UUID NOT NULL,
                `user_id` UUID NOT NULL,
                `username` VARCHAR(32) NOT NULL,
                `display_name` VARCHAR(64) NOT NULL,
                `avatar_url` VARCHAR(2048) NULL,
                `create_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6),
                `update_time` DATETIME(6) NOT NULL DEFAULT CURRENT_TIMESTAMP(6) ON UPDATE CURRENT_TIMESTAMP(6),
                PRIMARY KEY (`id`),
                CONSTRAINT `uq_account_username` UNIQUE (`username`),
                CONSTRAINT `fk_account_user` FOREIGN KEY (`user_id`) REFERENCES `user` (`id`) ON DELETE CASCADE,
                KEY `ix_account_user` (`user_id`, `id`)
              )
      rollback:
        - sql:
            sql: DROP TABLE `account`
