databaseChangeLog:
  - changeSet:
      id: 002-user-id-uuid
      author: exochat
      comment: >
        user.id becomes the native UUID type (ids are UUIDv7, generated by the application).
        Pre-release only: existing rows used non-UUID string ids and cannot be converted, so they are removed.
      changes:
        - sql:
            sql: DELETE FROM `user`
        - sql:
            sql: ALTER TABLE `user` MODIFY `id` UUID NOT NULL
      rollback:
        - sql:
            sql: DELETE FROM `user`
        - sql:
            sql: ALTER TABLE `user` MODIFY `id` VARCHAR(64) NOT NULL
