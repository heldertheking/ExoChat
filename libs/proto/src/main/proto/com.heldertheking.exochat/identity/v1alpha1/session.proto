syntax = "proto3";

package com.heldertheking.exochat.identity.v1alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "SessionProto";
option java_package = "com.heldertheking.exochat.identity.v1alpha1";

// Lists and revokes the sessions of a user. Sessions are created by AuthService (register, authenticate), never
// directly. Revoking a session is how a user logs out a device.
service SessionService {
  // Lists the sessions of a user, one per logged in device.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=users/*}/sessions"};
    option (google.api.method_signature) = "parent";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gets a session.
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (google.api.http) = {get: "/v1alpha1/{name=users/*/sessions/*}"};
    option (google.api.method_signature) = "name";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Revokes a session. Its refresh token stops working immediately. Access tokens already issued for it stay valid
  // until they expire, which is why they are short-lived.
  rpc DeleteSession(DeleteSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1alpha1/{name=users/*/sessions/*}"};
    option (google.api.method_signature) = "name";
  }
}

// A login of a user on one device. Holds the refresh token family and the account that is currently active.
message Session {
  option (google.api.resource) = {
    type: "exochat.heldertheking.com/Session"
    pattern: "users/{user}/sessions/{session}"
    singular: "session"
    plural: "sessions"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Label the client gave the device when it logged in, for example "Firefox on Windows".
  string device_label = 2 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Resource name of the account that is active in this session. Chosen with AuthService.SwitchAccount, the first
  // account of the user at login.
  string account = 3 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Account"}
  ];

  // True for the session the request was made with, so clients can mark "this device".
  bool current = 4 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Last time the refresh token of this session was used.
  google.protobuf.Timestamp last_used_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Time after which the session can no longer be refreshed, the user has to log in again.
  google.protobuf.Timestamp expire_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListSessionsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Session"}
  ];

  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  string next_page_token = 2;
}

message GetSessionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Session"}
  ];
}

message DeleteSessionRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Session"}
  ];
}
