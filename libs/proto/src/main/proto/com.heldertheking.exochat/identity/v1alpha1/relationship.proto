syntax = "proto3";

package com.heldertheking.exochat.identity.v1alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "RelationshipProto";
option java_package = "com.heldertheking.exochat.identity.v1alpha1";

// Manages the social links (friends, requests, blocks) of an account to other accounts. A friendship or a pending
// request exists once on each side: the sender sees PENDING_OUTGOING, the receiver PENDING_INCOMING, and both see
// FRIEND once the request is accepted. A block exists on the side of the blocker only, the blocked account learns
// nothing about it.
service RelationshipService {
  // Lists the relationships of an account.
  rpc ListRelationships(ListRelationshipsRequest) returns (ListRelationshipsResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=users/*/accounts/*}/relationships"};
    option (google.api.method_signature) = "parent";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gets a relationship.
  rpc GetRelationship(GetRelationshipRequest) returns (Relationship) {
    option (google.api.http) = {get: "/v1alpha1/{name=users/*/accounts/*/relationships/*}"};
    option (google.api.method_signature) = "name";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Sends a friend request to the target account. If the target already sent one to this account, both become
  // friends at once. Fails with FAILED_PRECONDITION if this account blocked the target and with ALREADY_EXISTS if
  // there already is a request or a friendship.
  rpc CreateRelationship(CreateRelationshipRequest) returns (Relationship) {
    option (google.api.http) = {
      post: "/v1alpha1/{parent=users/*/accounts/*}/relationships"
      body: "relationship"
    };
    option (google.api.method_signature) = "parent,relationship";
  }

  // Deletes a relationship: unfriends, withdraws a request, declines an incoming one or removes a block.
  rpc DeleteRelationship(DeleteRelationshipRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1alpha1/{name=users/*/accounts/*/relationships/*}"};
    option (google.api.method_signature) = "name";
  }

  // Accepts an incoming friend request.
  rpc AcceptRelationship(AcceptRelationshipRequest) returns (Relationship) {
    option (google.api.http) = {
      post: "/v1alpha1/{name=users/*/accounts/*/relationships/*}:accept"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Rejects an incoming friend request. The request disappears on both sides.
  rpc RejectRelationship(RejectRelationshipRequest) returns (RejectRelationshipResponse) {
    option (google.api.http) = {
      post: "/v1alpha1/{name=users/*/accounts/*/relationships/*}:reject"
      body: "*"
    };
    option (google.api.method_signature) = "name";
  }

  // Blocks an account, whether or not there is a relationship with it yet. Any friendship or request between the
  // two ends and disappears from the target's side.
  rpc BlockAccount(BlockAccountRequest) returns (BlockAccountResponse) {
    option (google.api.http) = {
      post: "/v1alpha1/{parent=users/*/accounts/*}/relationships:blockAccount"
      body: "*"
    };
    option (google.api.method_signature) = "parent,target_account";
  }
}

// A social link from the owning account to a target account.
message Relationship {
  option (google.api.resource) = {
    type: "exochat.heldertheking.com/Relationship"
    pattern: "users/{user}/accounts/{account}/relationships/{relationship}"
    singular: "relationship"
    plural: "relationships"
  };

  // State of a relationship from the point of view of the owning account.
  enum RelationshipType {
    RELATIONSHIP_TYPE_UNSPECIFIED = 0;
    RELATIONSHIP_TYPE_FRIEND = 1;
    RELATIONSHIP_TYPE_PENDING_INCOMING = 2;
    RELATIONSHIP_TYPE_PENDING_OUTGOING = 3;
    RELATIONSHIP_TYPE_BLOCKED = 4;
  }

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Resource name of the other account.
  string target_account = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Account"}
  ];
  // Set by the server: PENDING_OUTGOING for a request this account sent, PENDING_INCOMING for one it received,
  // FRIEND once a request was accepted, BLOCKED through BlockAccount.
  RelationshipType type = 3 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListRelationshipsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Relationship"}
  ];

  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListRelationshipsResponse {
  repeated Relationship relationships = 1;
  string next_page_token = 2;
}

message GetRelationshipRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Relationship"}
  ];
}

message CreateRelationshipRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Relationship"}
  ];

  Relationship relationship = 2 [(google.api.field_behavior) = REQUIRED];

  // TODO: Think about user-generated IDs (AIP-133)
  // string relationship_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteRelationshipRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Relationship"}
  ];
}

message AcceptRelationshipRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Relationship"}
  ];
}

message RejectRelationshipRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Relationship"}
  ];
}

message RejectRelationshipResponse {}

message BlockAccountRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Relationship"}
  ];

  // Resource name of the account to block.
  string target_account = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Account"}
  ];
}

message BlockAccountResponse {
  // The block, as seen by the blocking account.
  Relationship relationship = 1;
}
