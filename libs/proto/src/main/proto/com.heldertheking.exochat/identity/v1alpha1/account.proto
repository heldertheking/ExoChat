syntax = "proto3";

package com.heldertheking.exochat.identity.v1alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "AccountProto";
option java_package = "com.heldertheking.exochat.identity.v1alpha1";

// Manages accounts: the public personas of a user that join servers, add friends and send messages.
service AccountService {
  // Lists the accounts of a user.
  rpc ListAccounts(ListAccountsRequest) returns (ListAccountsResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=users/*}/accounts"};
    option (google.api.method_signature) = "parent";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gets an account.
  rpc GetAccount(GetAccountRequest) returns (Account) {
    option (google.api.http) = {get: "/v1alpha1/{name=users/*/accounts/*}"};
    option (google.api.method_signature) = "name";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates an account for a user.
  rpc CreateAccount(CreateAccountRequest) returns (Account) {
    option (google.api.http) = {
      post: "/v1alpha1/{parent=users/*}/accounts"
      body: "account"
    };
    option (google.api.method_signature) = "parent,account";
  }

  // Updates an account.
  rpc UpdateAccount(UpdateAccountRequest) returns (Account) {
    option (google.api.http) = {
      patch: "/v1alpha1/{account.name=users/*/accounts/*}"
      body: "account"
    };
    option (google.api.method_signature) = "account,update_mask";
  }

  // Deletes an account.
  rpc DeleteAccount(DeleteAccountRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1alpha1/{name=users/*/accounts/*}"};
    option (google.api.method_signature) = "name";
  }
}

// The public persona of a user.
message Account {
  option (google.api.resource) = {
    type: "exochat.heldertheking.com/Account"
    pattern: "users/{user}/accounts/{account}"
    singular: "account"
    plural: "accounts"
  };

  // (-- api-linter: core::0216::synonyms=disabled
  //     aip.dev/not-precedent: this is presence, not a lifecycle state, "status" is the common term. --)
  // Presence of an account. Live presence may be kept outside the database and filled in on read.
  enum AccountStatus {
    ACCOUNT_STATUS_UNSPECIFIED = 0;
    ACCOUNT_STATUS_ONLINE = 1;
    ACCOUNT_STATUS_IDLE = 2;
    ACCOUNT_STATUS_DND = 3;
    ACCOUNT_STATUS_OFFLINE = 4;
  }

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Unique handle. Chosen once and never changed.
  string username = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // Display name starts equal to initial username.
  string display_name = 3 [(google.api.field_behavior) = REQUIRED];

  // Location of the avatar image.
  string avatar_url = 4 [(google.api.field_behavior) = OPTIONAL];
  AccountStatus status = 5 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp create_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListAccountsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Account"}
  ];

  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListAccountsResponse {
  repeated Account accounts = 1;
  string next_page_token = 2;
}

message GetAccountRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Account"}
  ];
}

message CreateAccountRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Account"}
  ];

  Account account = 2 [(google.api.field_behavior) = REQUIRED];

  // TODO: Think about user-generated IDs (AIP-133)
  // string account_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateAccountRequest {
  Account account = 1 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteAccountRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Account"}
  ];
}
