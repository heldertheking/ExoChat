syntax = "proto3";

package com.heldertheking.exochat.messaging.v1alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option java_multiple_files = true;
option java_outer_classname = "ChannelOverwriteProto";
option java_package = "com.heldertheking.exochat.messaging.v1alpha1";

// Manages per-channel permission allow/deny overwrites for server channels.
service ChannelOverwriteService {
  // Lists overwrites.
  rpc ListChannelOverwrites(ListChannelOverwritesRequest) returns (ListChannelOverwritesResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=channels/*}/overwrites"};
    option (google.api.method_signature) = "parent";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gets a overwrite.
  rpc GetChannelOverwrite(GetChannelOverwriteRequest) returns (ChannelOverwrite) {
    option (google.api.http) = {get: "/v1alpha1/{name=channels/*/overwrites/*}"};
    option (google.api.method_signature) = "name";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a overwrite.
  rpc CreateChannelOverwrite(CreateChannelOverwriteRequest) returns (ChannelOverwrite) {
    option (google.api.http) = {
      post: "/v1alpha1/{parent=channels/*}/overwrites"
      body: "overwrite"
    };
    option (google.api.method_signature) = "parent,overwrite";
  }

  // Updates a overwrite.
  rpc UpdateChannelOverwrite(UpdateChannelOverwriteRequest) returns (ChannelOverwrite) {
    option (google.api.http) = {
      patch: "/v1alpha1/{overwrite.name=channels/*/overwrites/*}"
      body: "overwrite"
    };
    option (google.api.method_signature) = "overwrite,update_mask";
  }

  // Deletes a overwrite.
  rpc DeleteChannelOverwrite(DeleteChannelOverwriteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1alpha1/{name=channels/*/overwrites/*}"};
    option (google.api.method_signature) = "name";
  }
}

// Channel-level permission overwrite targeting a Role or an Account.
message ChannelOverwrite {
  option (google.api.resource) = {
    type: "exochat.heldertheking.com/ChannelOverwrite"
    pattern: "channels/{channel}/overwrites/{overwrite}"
    singular: "overwrite"
    plural: "overwrites"
  };

  enum OverwriteTargetType {
    OVERWRITE_TARGET_TYPE_UNSPECIFIED = 0;
    OVERWRITE_TARGET_TYPE_ROLE = 1;
    OVERWRITE_TARGET_TYPE_ACCOUNT = 2;
  }

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  OverwriteTargetType target_type = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Resource name of the target: a Role (target_type ROLE) or an Account (target_type ACCOUNT).
  string target = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {type: "*"}
  ];

  // Permission bitmask explicitly allowed in this channel.
  int64 allow = 4 [(google.api.field_behavior) = OPTIONAL];

  // Permission bitmask explicitly denied in this channel.
  int64 deny = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListChannelOverwritesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/ChannelOverwrite"}
  ];

  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListChannelOverwritesResponse {
  repeated ChannelOverwrite overwrites = 1;
  string next_page_token = 2;
}

message GetChannelOverwriteRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/ChannelOverwrite"}
  ];
}

message CreateChannelOverwriteRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/ChannelOverwrite"}
  ];

  ChannelOverwrite overwrite = 2 [(google.api.field_behavior) = REQUIRED];

  // TODO: Think about user-generated IDs (AIP-133)
  // string overwrite_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateChannelOverwriteRequest {
  ChannelOverwrite overwrite = 1 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteChannelOverwriteRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/ChannelOverwrite"}
  ];
}
