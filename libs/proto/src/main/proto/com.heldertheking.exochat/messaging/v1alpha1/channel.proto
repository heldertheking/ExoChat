syntax = "proto3";

package com.heldertheking.exochat.messaging.v1alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_outer_classname = "ChannelProto";
option java_package = "com.heldertheking.exochat.messaging.v1alpha1";

// Manages channels: the unified conversation container for direct, group and server channels.
//
// A channel is one entity with two names. The canonical name is `channels/{channel}`. Server
// channels can also be addressed as `servers/{server}/channels/{channel}`. Both resolve to the same
// channel, responses always carry the canonical name, and child resources (messages, participants,
// overwrites) live only under the canonical name.
service ChannelService {
  // Lists channels. Without a parent, lists the direct and group channels of the caller.
  // With a server parent, lists that server's channels.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse) {
    option (google.api.http) = {
      get: "/v1alpha1/channels"
      additional_bindings: {get: "/v1alpha1/{parent=servers/*}/channels"}
    };
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gets a channel by either of its names.
  rpc GetChannel(GetChannelRequest) returns (Channel) {
    option (google.api.http) = {
      get: "/v1alpha1/{name=channels/*}"
      additional_bindings: {get: "/v1alpha1/{name=servers/*/channels/*}"}
    };
    option (google.api.method_signature) = "name";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a channel. Direct channels have no parent, server channels use the server as parent.
  rpc CreateChannel(CreateChannelRequest) returns (Channel) {
    option (google.api.http) = {
      post: "/v1alpha1/channels"
      body: "channel"
      additional_bindings: {
        post: "/v1alpha1/{parent=servers/*}/channels"
        body: "channel"
      }
    };
    option (google.api.method_signature) = "channel";
    option (google.api.method_signature) = "parent,channel";
  }

  // Updates a channel by either of its names.
  rpc UpdateChannel(UpdateChannelRequest) returns (Channel) {
    option (google.api.http) = {
      patch: "/v1alpha1/{channel.name=channels/*}"
      body: "channel"
      additional_bindings: {
        patch: "/v1alpha1/{channel.name=servers/*/channels/*}"
        body: "channel"
      }
    };
    option (google.api.method_signature) = "channel,update_mask";
  }

  // Deletes a channel by either of its names.
  rpc DeleteChannel(DeleteChannelRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1alpha1/{name=channels/*}"
      additional_bindings: {delete: "/v1alpha1/{name=servers/*/channels/*}"}
    };
    option (google.api.method_signature) = "name";
  }
}

// A conversation container. The scope says who takes part (direct, group or server), the type what it is used for.
message Channel {
  option (google.api.resource) = {
    type: "exochat.heldertheking.com/Channel"
    pattern: "channels/{channel}"
    pattern: "servers/{server}/channels/{channel}"
    singular: "channel"
    plural: "channels"
  };

  // Who can take part in the channel.
  enum ChannelScope {
    CHANNEL_SCOPE_UNSPECIFIED = 0;
    // A 1:1 conversation between two accounts. There is at most one per pair of accounts.
    CHANNEL_SCOPE_DIRECT = 1;
    // A conversation between a fixed set of accounts outside any server.
    CHANNEL_SCOPE_GROUP = 2;
    // A channel that belongs to a server and follows its roles and overwrites.
    CHANNEL_SCOPE_SERVER = 3;
  }

  // What the channel is used for.
  enum ChannelType {
    CHANNEL_TYPE_UNSPECIFIED = 0;
    CHANNEL_TYPE_TEXT = 1;
    CHANNEL_TYPE_VOICE = 2;
    // TODO: server scope only, threaded posts.
    CHANNEL_TYPE_FORUM = 3;
    // TODO: server scope only, speakers and audience.
    CHANNEL_TYPE_STAGE = 4;
    // TODO: server scope only, only members with permission can post.
    CHANNEL_TYPE_ANNOUNCEMENT = 5;
  }

  // Always the canonical name, `channels/{channel}`.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // DIRECT and GROUP channels are TEXT or VOICE, every type is allowed in SERVER scope.
  ChannelScope scope = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  ChannelType type = 3 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];

  // Resource name of the owning server. Set exactly when the scope is SERVER.
  string server = 4 [
    (google.api.field_behavior) = IMMUTABLE,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Server"}
  ];

  // Required for server channels and optional for group channels.
  string display_name = 5 [(google.api.field_behavior) = OPTIONAL];

  // Order of a server channel within its server.
  int32 position = 6 [(google.api.field_behavior) = OPTIONAL];

  google.protobuf.Timestamp last_message_time = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListChannelsRequest {
  // Optional: a server (`servers/{server}`). Empty lists the caller's direct channels.
  string parent = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Channel"}
  ];

  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListChannelsResponse {
  repeated Channel channels = 1;
  string next_page_token = 2;
}

message GetChannelRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Channel"}
  ];
}

message CreateChannelRequest {
  // Optional: a server (`servers/{server}`). Empty for direct and group channels.
  string parent = 1 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Channel"}
  ];

  Channel channel = 2 [(google.api.field_behavior) = REQUIRED];

  // TODO: Think about user-generated IDs (AIP-133)
  // string channel_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateChannelRequest {
  Channel channel = 1 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteChannelRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Channel"}
  ];
}
