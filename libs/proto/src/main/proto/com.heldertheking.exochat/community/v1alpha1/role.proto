syntax = "proto3";

package com.heldertheking.exochat.community.v1alpha1;

import "google/api/annotations.proto";
import "google/api/client.proto";
import "google/api/field_behavior.proto";
import "google/api/resource.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option java_multiple_files = true;
option java_outer_classname = "RoleProto";
option java_package = "com.heldertheking.exochat.community.v1alpha1";

// Manages the server-defined permission bundles assigned to members.
service RoleService {
  // Lists roles.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = {get: "/v1alpha1/{parent=servers/*}/roles"};
    option (google.api.method_signature) = "parent";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Gets a role.
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = {get: "/v1alpha1/{name=servers/*/roles/*}"};
    option (google.api.method_signature) = "name";
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Creates a role.
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (google.api.http) = {
      post: "/v1alpha1/{parent=servers/*}/roles"
      body: "role"
    };
    option (google.api.method_signature) = "parent,role";
  }

  // Updates a role.
  rpc UpdateRole(UpdateRoleRequest) returns (Role) {
    option (google.api.http) = {
      patch: "/v1alpha1/{role.name=servers/*/roles/*}"
      body: "role"
    };
    option (google.api.method_signature) = "role,update_mask";
  }

  // Deletes a role.
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/v1alpha1/{name=servers/*/roles/*}"};
    option (google.api.method_signature) = "name";
  }
}

// A named permission bundle defined by a server.
message Role {
  option (google.api.resource) = {
    type: "exochat.heldertheking.com/Role"
    pattern: "servers/{server}/roles/{role}"
    singular: "role"
    plural: "roles"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  string display_name = 2 [(google.api.field_behavior) = REQUIRED];

  // Display color as 0xRRGGBB.
  int32 color = 3 [(google.api.field_behavior) = OPTIONAL];

  // Higher positions outrank lower ones.
  int32 position = 4 [(google.api.field_behavior) = OPTIONAL];

  // Permission bitmask.
  int64 permissions = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListRolesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Role"}
  ];

  int32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];
}

message ListRolesResponse {
  repeated Role roles = 1;
  string next_page_token = 2;
}

message GetRoleRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Role"}
  ];
}

message CreateRoleRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {child_type: "exochat.heldertheking.com/Role"}
  ];

  Role role = 2 [(google.api.field_behavior) = REQUIRED];

  // TODO: Think about user-generated IDs (AIP-133)
  // string role_id = 3 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateRoleRequest {
  Role role = 1 [(google.api.field_behavior) = REQUIRED];

  google.protobuf.FieldMask update_mask = 2 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteRoleRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference) = {type: "exochat.heldertheking.com/Role"}
  ];
}
