- included_paths:
    - '**/*.proto'
  disabled_rules:
    # Deliberate deviations from the Google AIPs
    # The proto directory is `com.heldertheking.exochat/<domain>/<version>`, the package uses dots (buf has the same exception).
    - core::0191::proto-package
    # Services, RPCs and resources have comments; the request/response boilerplate and plain fields do not need them.
    - core::0192::has-comments
    # Ids are UUIDv7 generated by the application (ADR-011); user supplied ids (AIP-133) are still open, see the TODO in the create requests.
    - core::0133::request-id-field
    # AuthService returns identity messages (User, Account, Session) on purpose: auth depends on identity.
    - core::0215::foreign-type-reference
    - core::0124::reference-same-package
- included_paths:
    - '**/health/**/*.proto'
  disabled_rules:
    # The health check is a plain gRPC call (Kubernetes-style probe), not part of the resource oriented API.
    - core::0136::verb-noun
    - core::0127::http-annotation
