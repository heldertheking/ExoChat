spring:
  application:
    name: exochat
  grpc:
    server:
      port: 9090
  datasource:
    # Defaults match docker-compose.yml (database "exochat"); override via env.
    url: ${JDBC_URL:jdbc:mariadb://localhost:3308/exochat}
    username: ${JDBC_USER:exochat}
    password: ${JDBC_PASSWORD:exoch4t}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    database-change-log-table: ec_databasechangelog
    database-change-log-lock-table: ec_databasechangeloglock

# Authentication (ADR-012). All values are optional in development: without a signing key an ephemeral one is
# generated at startup and every access token dies with the process. In production set the key pair, for example
#   EXOCHAT_AUTH_SIGNING_PRIVATE_KEY  PKCS#8 PEM of an EC P-256 key (openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256)
#   EXOCHAT_AUTH_SIGNING_PUBLIC_KEY   the matching public key PEM (openssl ec -in private.pem -pubout)
#   EXOCHAT_AUTH_SIGNING_KEY_ID       kid header, change it with the key
exochat:
  auth:
    issuer: exochat
    access-token-ttl: 15m
    refresh-token-idle-ttl: 30d
    refresh-token-max-ttl: 90d
